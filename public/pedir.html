<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hacé tu pedido</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
  <style>
    :root { --pico-primary: #0b6e4f; --pico-primary-background: #0b6e4f; --pico-primary-border: #0b6e4f; --pico-primary-hover-background: #095c42; }
    [x-cloak] { display: none !important; }
    body { background: #f4f7f6; }
    main { max-width: 640px; margin: 0 auto; padding: 1rem; }
    .cabecera { text-align: center; margin-bottom: 1rem; }
    .cabecera .emoji { font-size: 3rem; width: 5rem; height: 5rem; margin: 0 auto; display: grid; place-items: center; border-radius: 50%; background: var(--color-rubro, #0b6e4f); box-shadow: 0 4px 14px #0003; }
    .chat { background: #efeae2; border-radius: 14px; padding: .8rem; min-height: 280px; max-height: 55vh; overflow-y: auto; display: flex; flex-direction: column; gap: .4rem; }
    .b { max-width: 85%; padding: .5rem .7rem; border-radius: 10px; white-space: pre-wrap; font-size: .95rem; }
    .b.negocio { background: #fff; align-self: flex-start; }
    .b.cliente { background: #d9fdd3; align-self: flex-end; }
    .b.pensando { color: #667781; font-style: italic; }
    /* El cuadro de texto ocupa todo el ancho; los botones van abajo. */
    form.escribir { margin-top: .6rem; }
    form.escribir textarea { width: 100%; margin: 0 0 .5rem; min-height: 5.5rem; max-height: 40vh; font-size: 1.05rem; line-height: 1.4; resize: vertical; }
    .acciones { display: flex; gap: .5rem; align-items: stretch; }
    .acciones > * { margin: 0 !important; }
    .acciones .icono, .acciones button[type=button] { flex: 0 0 3.4rem; width: 3.4rem; padding: 0; display: grid; place-items: center; font-size: 1.3rem; }
    .acciones button[type=submit] { flex: 1; width: auto; padding: .7rem 1rem; font-size: 1.05rem; }
    .icono { border: 1px solid var(--pico-primary); border-radius: var(--pico-border-radius); cursor: pointer; }
    .icono input { display: none; }
    .oir { display: block; margin: .3rem 0 0; padding: .1rem .6rem; width: auto; font-size: .8rem; border-radius: 1rem; background: transparent; color: var(--pico-primary); border: 1px solid var(--pico-primary); }
    .rec { background: #c62828 !important; border-color: #c62828 !important; }
    .resumen { margin-top: 1rem; }
    .resumen li { display: flex; justify-content: space-between; list-style: none; }
    .error { background: #c62828; color: #fff; padding: .6rem; border-radius: 8px; cursor: pointer; }
  </style>
  <script>
    async function revisar(r) {
      if (r.ok) return r
      const { error } = await r.json().catch(() => ({}))
      throw new Error(error || `El servidor respondió ${r.status}.`)
    }
    const leerLocal = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } }
    const guardarLocal = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
    async function achicar(archivo) {
      const img = await createImageBitmap(archivo)
      const k = Math.min(1, 1280 / Math.max(img.width, img.height))
      const cv = Object.assign(document.createElement('canvas'), { width: img.width * k, height: img.height * k })
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height)
      return cv.toDataURL('image/jpeg', 0.85)
    }
    // Escuchar la respuesta del bot (voz de OpenAI; si falla, la del navegador).
    let audioActual = null
    async function escuchar(texto) {
      audioActual?.pause(); window.speechSynthesis?.cancel()
      try {
        const r = await fetch('/api/voz', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ texto: String(texto).slice(0, 1200) }) })
        if (!r.ok) throw new Error()
        audioActual = new Audio(URL.createObjectURL(await r.blob()))
        await audioActual.play()
      } catch {
        if (!('speechSynthesis' in window)) return
        const u = new SpeechSynthesisUtterance(texto); u.lang = 'es-AR'; speechSynthesis.speak(u)
      }
    }
    document.addEventListener('alpine:init', () => {
      Alpine.data('pedir', () => ({
        negocio: null, mensajes: leerLocal('pedirMensajes', []), conversacion: leerLocal('pedirConversacion', null),
        escuchar, texto: '', ocupado: false, grabando: false, error: '', items: [], total: 0,
        async init() {
          try { this.negocio = await (await revisar(await fetch('/api/publico/negocio'))).json() } catch (e) { this.error = e.message }
          if (this.negocio) {
            document.title = `${this.negocio.emoji} ${this.negocio.nombre} · Hacé tu ${this.negocio.palabraVenta}`
            const r = document.documentElement.style
            if (/^#[0-9a-f]{6}$/i.test(this.negocio.color)) for (const v of ['--pico-primary', '--pico-primary-background', '--pico-primary-border', '--color-rubro']) r.setProperty(v, this.negocio.color)
            document.querySelector('link[rel=icon]').href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>${encodeURIComponent(this.negocio.emoji)}</text></svg>`
          }
          this.bajar()
        },
        pesos: (v) => '$' + Math.round(v || 0).toLocaleString('es-AR'),
        bajar() { this.$nextTick(() => { const c = this.$refs.chat; if (c) c.scrollTop = c.scrollHeight }) },
        async enviar(datos, mostrar) {
          this.mensajes.push({ de: 'cliente', texto: mostrar })
          this.ocupado = true
          this.error = ''
          this.bajar()
          try {
            const r = await (await revisar(await fetch('/api/publico/chat', {
              method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ conversacion: this.conversacion, ...datos }),
            }))).json()
            this.conversacion = r.conversacion
            this.items = r.items
            this.total = r.total
            this.mensajes.push({ de: 'negocio', texto: r.respuesta })
            if (this.negocio?.leerAutomatico) escuchar(r.respuesta)
            guardarLocal('pedirMensajes', this.mensajes)
            guardarLocal('pedirConversacion', this.conversacion)
          } catch (e) { this.error = e.message } finally { this.ocupado = false; this.bajar() }
        },
        mandarTexto() {
          const t = this.texto.trim()
          if (!t) return
          this.texto = ''
          if (this.$refs.caja) this.$refs.caja.style.height = ''
          return this.enviar({ texto: t }, t)
        },
        async foto(e) {
          const a = e.target.files[0]
          e.target.value = ''
          if (a) this.enviar({ imagen: await achicar(a), ...(this.texto.trim() ? { texto: this.texto.trim() } : {}) }, '📷 Foto')
        },
        async grabar() {
          if (this.grabando) { this._rec.stop(); return }
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
            const partes = []
            this._rec = new MediaRecorder(stream)
            this._rec.ondataavailable = (ev) => partes.push(ev.data)
            this._rec.onstop = async () => {
              stream.getTracks().forEach((t) => t.stop())
              this.grabando = false
              const tipo = this._rec.mimeType || 'audio/webm'
              this.ocupado = true
              try {
                const { texto } = await (await revisar(await fetch('/api/audio', { method: 'POST', headers: { 'x-extension': tipo.includes('mp4') ? 'mp4' : 'webm' }, body: new Blob(partes, { type: tipo }) }))).json()
                this.ocupado = false
                await this.enviar({ texto }, '🎤 ' + texto)
              } catch (e) { this.error = e.message; this.ocupado = false }
            }
            this._rec.start()
            this.grabando = true
          } catch { this.error = 'No pude usar el micrófono.' }
        },
        nueva() { this.mensajes = []; this.conversacion = null; this.items = []; this.total = 0; guardarLocal('pedirMensajes', []); guardarLocal('pedirConversacion', null) },
      }))
    })
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>
<main x-data="pedir" x-cloak>
  <div class="cabecera">
    <div class="emoji" x-text="negocio?.emoji || '🛍️'"></div>
    <h2 x-text="negocio?.nombre || 'Cargando…'" style="margin:0"></h2>
    <p x-text="negocio?.saludo"></p>
  </div>
  <p class="error" x-show="error" x-text="error" @click="error = ''"></p>
  <div class="chat" x-ref="chat">
    <div class="b negocio" x-show="!mensajes.length" x-text="'¡Hola! 👋 Soy ' + (negocio?.botNombre || 'el asistente') + '. Contame qué necesitás: podés escribir, mandar una foto de tu lista o un audio.'"></div>
    <template x-for="(m, i) in mensajes" :key="i"><div class="b" :class="m.de"><span x-text="(m.de === 'negocio' ? (negocio?.emoji || '') + ' ' : '') + m.texto"></span>
      <button class="oir" x-show="m.de === 'negocio' && negocio?.escucharMensajes" @click="escuchar(m.texto)" aria-label="Escuchar">🔊 Escuchar</button></div></template>
    <div class="b negocio pensando" x-show="ocupado" x-text="(negocio?.botNombre || 'El negocio') + ' está escribiendo…'"></div>
  </div>
  <form class="escribir" @submit.prevent="mandarTexto">
    <textarea x-model="texto" rows="3" x-ref="caja" :placeholder="'Escribí tu ' + (negocio?.palabraVenta || 'pedido') + ' o consulta…'" aria-label="Mensaje" :disabled="ocupado"
      @input="$el.style.height = 'auto'; $el.style.height = $el.scrollHeight + 'px'"
      @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); mandarTexto() }"></textarea>
    <div class="acciones">
      <label class="icono" title="Mandar una foto de tu lista">📷<input type="file" accept="image/*" @change="foto" :disabled="ocupado"></label>
      <button type="button" class="outline" :class="{ rec: grabando }" @click="grabar" :disabled="ocupado && !grabando" x-text="grabando ? '⏹' : '🎤'" aria-label="Grabar audio"></button>
      <button type="submit" :disabled="ocupado || !texto.trim()" :aria-busy="ocupado">Enviar ➤</button>
    </div>
  </form>
  <p x-show="negocio?.ejemplo && !mensajes.length"><small><a href="#" @click.prevent="texto = negocio.ejemplo; mandarTexto()">💡 Probar con un ejemplo</a></small></p>
  <article class="resumen" x-show="items.length">
    <header><strong x-text="'🧾 Tu ' + (negocio?.palabraVenta || 'pedido')"></strong></header>
    <ul style="padding:0">
      <template x-for="it in items"><li><span x-text="it.cantidad + ' × ' + it.producto"></span><b x-text="it.precio == null ? 'a confirmar' : pesos(it.subtotal)"></b></li></template>
    </ul>
    <footer><strong x-text="'Total estimado: ' + pesos(total)"></strong> <small>· el negocio te lo confirma</small></footer>
  </article>
  <details>
    <summary>Ver productos y precios</summary>
    <ul><template x-for="p in negocio?.catalogo || []"><li><span x-text="p.producto"></span> <small x-text="p.precio == null ? '· consultar' : '· ' + pesos(p.precio) + ' / ' + p.unidad"></small></li></template></ul>
  </details>
  <p><small><a href="#" @click.prevent="nueva">Empezar un pedido nuevo</a> · Atendido con IA por Mostrador</small></p>
</main>
</body>
</html>
